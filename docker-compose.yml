services:
  scnexus-core-api:
    build: ./SCNexus.Core.API
    container_name: scnexus-core-api
    network_mode: bridge
    extra_hosts:
      - "sunsetcorp.local:10.10.100.8"
      - "host.docker.internal:host-gateway"
    ports:
      - "5053:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - LDAPTLS_REQCERT=never

