version: '3.9'
services:
  scnexus-core-api:
    build: ./SCNexus.Core.API
    container_name: scnexus-core-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal\SQLEXPRESS;Database=scnexus_core;User Id=laravel_user;Password=12345;TrustServerCertificate=True;
