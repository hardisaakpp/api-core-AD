trigger:
  branches:
    include:
      - main
      - test
      - ci/*
      - feature/*
      - fix/*
      - bugfix/*
      - hotfix/*

pool:
  name: 'agents-srv-test'
  demands:
    - Agent.OS -equals Linux

variables:
  - group: acr-credentials
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '8.x'
  - name: imageName
    value: 'dockermg-g9hrgcc4etdrh8eg.azurecr.io/api-core-scnexus'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/SCNexus.Core.API/Dockerfile'
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - name: envTag
      value: 'prod-latest'
    - name: uniqueTag
      value: 'prod-$(Build.BuildId)'
  - ${{ elseif eq(variables['Build.SourceBranchName'], 'test') }}:
    - name: envTag
      value: 'test-latest'
    - name: uniqueTag
      value: 'test-$(Build.BuildId)'
  - ${{ else }}:
    - name: envTag
      value: 'none'
    - name: uniqueTag
      value: 'none'

stages:
- stage: CI_Code_Quality
  displayName: 'Integración Continua - Calidad de Código'
  jobs:
  - job: Validar_Codigo
    displayName: 'Compilación .NET Core 8'
    steps:

    - task: UseDotNet@2
      displayName: 'Setup .NET $(dotnetVersion) SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: 'SCNexus.Core.API/**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build project'
      inputs:
        command: 'build'
        projects: 'SCNexus.Core.API/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

- stage: Build_Docker
  displayName: 'Construcción de Imagen Docker'
  dependsOn: CI_Code_Quality
  condition: and(succeeded(), ne(variables.envTag, 'none'))
  jobs:
  - job: BuildAndPush
    displayName: 'Build & Push Docker Azure'
    steps:

    - script: |
        echo "=== 1. Autenticando en Azure Container Registry ==="
        echo "$(acr-password)" | docker login dockermg-g9hrgcc4etdrh8eg.azurecr.io \
          -u "$(acr-username)" \
          --password-stdin

        echo "=== 2. Construyendo imagen ($(envTag)) ==="
        docker build -f $(dockerfilePath) \
          -t $(imageName):$(uniqueTag) \
          -t $(imageName):$(envTag) \
          $(Build.SourcesDirectory)

        echo "=== 3. Publicando en Azure Container Registry ==="
        docker push $(imageName):$(uniqueTag)
        docker push $(imageName):$(envTag)
      displayName: 'Empaquetar y Almacenar Contenedor en Azure'