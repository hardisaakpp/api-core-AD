trigger:
  branches:
    include:
      - main
      - test
      - ci/*
      - feature/*
      - fix/*
      - bugfix/*
      - hotfix/*

pool:
  name: 'agents-srv-test'
  demands:
    - Agent.OS -equals Linux

variables:
  - group: acr-credentials
  - name: buildConfiguration
    value: 'Release'
  - name: dotnetVersion
    value: '8.x'
  - name: imageName
    value: 'dockermg-g9hrgcc4etdrh8eg.azurecr.io/api-core-scnexus'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/SCNexus.Core.API/Dockerfile'
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - name: envTag
      value: 'prod-latest'
    - name: uniqueTag
      value: 'prod-$(Build.BuildId)'
  - ${{ elseif eq(variables['Build.SourceBranchName'], 'test') }}:
    - name: envTag
      value: 'test-latest'
    - name: uniqueTag
      value: 'test-$(Build.BuildId)'
  - ${{ else }}:
    - name: envTag
      value: 'none'
    - name: uniqueTag
      value: 'none'

stages:
- stage: CI_Code_Quality
  displayName: 'Integración Continua - Calidad de Código'
  jobs:
  - job: Validar_Codigo
    displayName: 'Compilación .NET Core 8'
    steps:

    - task: UseDotNet@2
      displayName: 'Setup .NET $(dotnetVersion) SDK'
      inputs:
        packageType: 'sdk'
        version: '$(dotnetVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Restore dependencies'
      inputs:
        command: 'restore'
        projects: 'SCNexus.Core.API/**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build project'
      inputs:
        command: 'build'
        projects: 'SCNexus.Core.API/**/*.csproj'
        arguments: '--configuration $(buildConfiguration) --no-restore'

- stage: Build_Docker
  displayName: 'Construcción de Imagen Docker'
  dependsOn: CI_Code_Quality
  condition: and(succeeded(), ne(variables.envTag, 'none'))
  jobs:
  - job: BuildAndPush
    displayName: 'Build & Push Docker Azure'
    steps:

    # [CAMBIO 1 y 3]: Uso de bash, set -euo pipefail e inyección segura por env:
    - bash: |
        set -euo pipefail
        echo "=== 1. Autenticando en Azure Container Registry ==="
        printf '%s' "$ACR_PASSWORD" | docker login dockermg-g9hrgcc4etdrh8eg.azurecr.io -u "$ACR_USERNAME" --password-stdin

        echo "=== 2. Construyendo imagen ($ENV_TAG) ==="
        docker build -f $DOCKERFILE_PATH \
          -t $IMAGE_NAME:$UNIQUE_TAG \
          -t $IMAGE_NAME:$ENV_TAG \
          $(Build.SourcesDirectory)

        echo "=== 3. Publicando en Azure Container Registry ==="
        docker push $IMAGE_NAME:$UNIQUE_TAG
        docker push $IMAGE_NAME:$ENV_TAG
      displayName: 'Empaquetar y Almacenar Contenedor en Azure'
      env:
        ACR_USERNAME: $(acrUsername)
        ACR_PASSWORD: $(acrPassword)
        ENV_TAG: $(envTag)
        UNIQUE_TAG: $(uniqueTag)
        IMAGE_NAME: $(imageName)
        DOCKERFILE_PATH: $(dockerfilePath)

    # [CAMBIO 2]: Generación del artefacto de texto (manifiesto)
    - bash: |
        set -euo pipefail
        mkdir -p $(Build.ArtifactStagingDirectory)/deploy-info
        echo "$(uniqueTag)" > $(Build.ArtifactStagingDirectory)/deploy-info/image-tag.txt
        echo "Tag publicado para CD: $(uniqueTag)"
      displayName: 'Generar metadata de despliegue'

    # [CAMBIO 2]: Publicación del artefacto para que el CD lo pueda leer
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/deploy-info'
        ArtifactName: 'deploy-info'
      displayName: 'Publicar artefacto deploy-info'